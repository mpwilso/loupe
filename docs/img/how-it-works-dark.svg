<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 549" width="660" height="549" role="img" aria-label="How Loupe works: setup turns your documents into sourced context files; each input gets a readiness check, a story in your template, the checker until it passes, and a reread of every known fact against its source."><title>How Loupe works: setup turns your documents into sourced context files; each input gets a readiness check, a story in your template, the checker until it passes, and a reread of every known fact against its source.</title><rect class="swatch" data-owner="you" x="24" y="16" width="14" height="14" rx="3" fill="#E9EEF0" stroke="#1F8A6E"/><text x="46" y="27.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#E9EEF0">You</text><rect class="swatch" data-owner="loupe" x="93" y="16" width="14" height="14" rx="3" fill="#0E5E4E" stroke="#1F8A6E"/><text x="115" y="27.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#E9EEF0">Loupe (the model)</text><rect class="swatch" data-owner="automatic" x="266" y="16" width="14" height="14" rx="3" fill="#7BD9B8" stroke="#1F8A6E"/><text x="288" y="27.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#E9EEF0">Automatic (the checker)</text><g class="box" data-owner="loupe"><rect x="24" y="56" width="392" height="57" rx="4" fill="#0E5E4E" stroke="#1F8A6E" stroke-width="1.5"/><text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#E9EEF0"><tspan x="38" y="76.4">Setup, once: your team's documents become</tspan><tspan x="38" y="94.6">context files, every fact with its source</tspan></text></g><line x1="220" y1="113" x2="220" y2="136" stroke="#E9EEF0" stroke-width="1.5"/><polygon points="220,141 216,136 224,136" fill="#E9EEF0"/><g class="box" data-owner="you"><rect x="24" y="141" width="392" height="39" rx="4" fill="#E9EEF0" stroke="#1F8A6E" stroke-width="1.5"/><text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#10151C"><tspan x="38" y="161.4">A note, transcript, ticket or email comes in</tspan></text></g><line x1="220" y1="180" x2="220" y2="203" stroke="#E9EEF0" stroke-width="1.5"/><polygon points="220,208 216,203 224,203" fill="#E9EEF0"/><g class="box" data-owner="loupe"><rect x="24" y="208" width="392" height="39" rx="4" fill="#0E5E4E" stroke="#1F8A6E" stroke-width="1.5"/><text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#E9EEF0"><tspan x="38" y="228.4">Readiness check: enough to build from?</tspan></text></g><g class="box note"><rect x="456" y="192" width="180" height="71" rx="4" fill="none" stroke="#7BD9B8" stroke-width="1.5" stroke-dasharray="4 3"/><text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#E9EEF0"><tspan x="470" y="211.6">Too thin: "Not ready</tspan><tspan x="470" y="228.4">yet", with the</tspan><tspan x="470" y="245.2">questions to ask</tspan></text></g><line x1="416" y1="227.5" x2="451" y2="227.5" stroke="#E9EEF0" stroke-width="1.5"/><polygon points="456,227.5 451,223.5 451,231.5" fill="#E9EEF0"/><line x1="220" y1="247" x2="220" y2="270" stroke="#E9EEF0" stroke-width="1.5"/><polygon points="220,275 216,270 224,270" fill="#E9EEF0"/><text x="230" y="265" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#E9EEF0">Ready</text><g class="box" data-owner="loupe"><rect x="24" y="275" width="392" height="39" rx="4" fill="#0E5E4E" stroke="#1F8A6E" stroke-width="1.5"/><text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#E9EEF0"><tspan x="38" y="295.4">Written in your team's template</tspan></text></g><line x1="220" y1="314" x2="220" y2="337" stroke="#E9EEF0" stroke-width="1.5"/><polygon points="220,342 216,337 224,337" fill="#E9EEF0"/><g class="box" data-owner="automatic"><rect x="24" y="342" width="392" height="57" rx="4" fill="#7BD9B8" stroke="#1F8A6E" stroke-width="1.5"/><text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#10151C"><tspan x="38" y="362.4">The checker checks the shape. Loupe fixes and</tspan><tspan x="38" y="380.6">reruns until it passes</tspan></text></g><line x1="220" y1="399" x2="220" y2="422" stroke="#E9EEF0" stroke-width="1.5"/><polygon points="220,427 216,422 224,422" fill="#E9EEF0"/><g class="box" data-owner="loupe"><rect x="24" y="427" width="392" height="39" rx="4" fill="#0E5E4E" stroke="#1F8A6E" stroke-width="1.5"/><text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#E9EEF0"><tspan x="38" y="447.4">Every known fact reread against its source</tspan></text></g><line x1="220" y1="466" x2="220" y2="489" stroke="#E9EEF0" stroke-width="1.5"/><polygon points="220,494 216,489 224,489" fill="#E9EEF0"/><g class="box" data-owner="you"><rect x="24" y="494" width="392" height="39" rx="4" fill="#E9EEF0" stroke="#1F8A6E" stroke-width="1.5"/><text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#10151C"><tspan x="38" y="514.4">You get the story</tspan></text></g></svg>
