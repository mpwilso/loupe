name: tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older run, except on master.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    # A same-repo pull request already gets a push run, so a pull request runs only from a fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The oldest Node we support, and the one we use day to day.
        node: ['22.18.0', '24.21.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # "shell: bash" adds pipefail, so a failing test fails the step even through tee.
      - run: scripts/test.sh 2>&1 | tee test-output.txt
        shell: bash
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-output-${{ matrix.node }}
          path: test-output.txt

  # The Agent Skills reference validator, skills-ref, on the built skill folder. It runs from a fixed commit of
  # agentskills/agentskills, with only the dependency versions its lockfile pins, so nothing is built or floats.
  skills-ref:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: agentskills/agentskills
          ref: 69ef37e9424c0a7ea9dd2293b559e43ec8176379
          path: agentskills
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.15'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.18'
          enable-cache: false
      - run: node scripts/skill-folder.ts dist/loupe
      - run: uv sync --frozen --no-dev --no-install-project --project agentskills/skills-ref
        env:
          UV_PYTHON_DOWNLOADS: never
      - run: PYTHONPATH=agentskills/skills-ref/src agentskills/skills-ref/.venv/bin/python -m skills_ref.cli validate dist/loupe

  # Files for the hand trial: the skill zip, and the Pellwick kit without the expected stories, so the trial stays blind.
  # Built on master and on demand, never for a pull request.
  trial-kit:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: scripts/build-skill.sh
      # GitHub zips the artifact itself, so the download is the skill with loupe/ at its root.
      # A glob keeps dist/ as the root; a plain dist/loupe/ would drop the loupe/ folder.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loupe-skill
          path: |
            dist/*
            !dist/loupe-skill.zip
          if-no-files-found: error
          retention-days: 7
      # One folder, so the kit's files sit at its root: context/, templates/, inputs/, raw/ and the trial plan.
      - run: scripts/build-trial-kit.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pellwick-trial-kit
          path: build/pellwick-trial-kit/
          if-no-files-found: error
          retention-days: 7
